[package]
name = "remote-native"
version = "2.6.1030"
description = "Remote's one native module: display capture, posted input, permission checks and the menu-bar picture"
authors = ["RUNNERS-IM"]
license-file = "../LICENSE.md"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Why: draws the menu-bar picture (frame + arrow) at runtime, so the moving "being viewed" picture needs no image files.
# Pinned so every RUNNERS app (Monitor draws its bars the same way) renders the shared frame with the same pixels.
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "simd", "png-format"] }

# Why: ScreenCaptureKit through the objc2 family, so no Swift build step. Pinned because these generated bindings
# change shape between minor versions.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSDictionary", "NSArray", "NSEnumerator", "NSError", "NSValue"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSScreen", "NSGraphics", "NSWorkspace", "NSRunningApplication"] }
objc2-screen-capture-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-core-graphics", "SCShareableContent", "SCStream", "SCScreenshotManager"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFData", "CFDictionary", "CFNumber", "CFString", "CFCGTypes"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGImage", "CGWindow"] }
objc2-image-io = { version = "=0.3.2", default-features = false, features = ["std", "CGImageDestination", "objc2-core-graphics"] }
# Why: CGEvent and CGDisplay with safe wrappers.
core-graphics = "0.25"
core-foundation = "0.10"

[build-dependencies]
napi-build = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
