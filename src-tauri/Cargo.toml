[package]
name = "remote"
version = "0.1.0"
description = "See and click the screens of other computers, one monitor at a time"
authors = ["RUNNERS-IM"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "remote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2.7.2"
sys-locale = "0.3.2"
# Why: draws the menu-bar picture (frame + arrow) when the app starts, so the moving "being viewed" picture needs no
# image files. Pinned so every RUNNERS app (Monitor draws its bars the same way) renders the same pixels.
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "simd"] }

# Why: ScreenCaptureKit through the objc2 family, the same bindings Tauri already builds on, so no Swift build step
# and no second copy of the Apple types. Pinned because these generated bindings change shape between minor versions.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSDictionary", "NSAttributedString", "NSArray", "NSError", "NSValue"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSScreen", "NSGraphics"] }
objc2-screen-capture-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-core-graphics", "SCShareableContent", "SCStream", "SCScreenshotManager"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFData", "CFDictionary", "CFNumber", "CFString", "CFCGTypes"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGImage", "CGWindow"] }
objc2-image-io = { version = "=0.3.2", default-features = false, features = ["std", "CGImageDestination", "objc2-core-graphics"] }
# Why: CGEvent and CGDisplay with safe wrappers; already in the tree through Tauri's window code.
core-graphics = "0.25"
core-foundation = "0.10"

[dev-dependencies]
# Why: the tray picture test can write PNG files to look at; the app itself never writes PNG.
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "simd", "png-format"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
